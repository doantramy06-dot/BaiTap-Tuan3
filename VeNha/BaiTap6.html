<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Học web chuẩn</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        padding: 40px 0;
    }

    /* Khung bao ngoài canh giữa */
    .portfolio {
        width: 1020px;
        margin: 0 auto;
        text-align: center;
    }

    /* Tiêu đề MY PORTFOLIO */
    .portfolio h2 {
        font-size: 30px;
        font-weight: bold;
        color: #222222;
        letter-spacing: 1px;
    }

    /* Vạch gạch ngang xanh ngọc dưới tiêu đề */
    .portfolio h2::after {
        content: "";
        display: block;
        width: 60px;
        height: 3px;
        background-color: #38a39d;
        margin: 15px auto 30px auto;
    }

    /* Thanh menu lọc */
    .list-tab {
        list-style: none;
        margin-bottom: 35px;
    }

    .list-tab li {
        display: inline-block;
        margin: 0 14px;
    }

    .list-tab li a {
        text-decoration: none;
        color: #444444;
        font-weight: bold;
        font-size: 14px;
    }

    /* Tab 'All' có màu xanh ngọc */
    .list-tab li:first-child a {
        color: #38a39d;
    }

    /* Lưới 3 cột hình chữ nhật màu xanh */
    .galerry {
        list-style: none;
        text-align: left;
    }

    .galerry li {
        display: inline-block;
        width: 320px;
        height: 240px;
        margin-right: 20px;
        margin-bottom: 25px;
        vertical-align: top;
        background-color: #8ec673; /* Màu xanh lá chuẩn theo hình mẫu */
    }

    /* Bỏ khoảng cách mép phải của cột thứ 3 để vừa hàng ngang */
    .galerry li:nth-child(3n) {
        margin-right: 0;
    }

    .galerry li a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        text-decoration: none;
        color: #ffffff;
        font-size: 26px;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    /* Nếu dùng thẻ img thì phủ kín khung */
    .galerry li img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
</style>
</head>
<body>

<section class="portfolio">
    <h2>MY PORTFOLIO</h2>
    
    <ul class="list-tab">
        <li><a href="./">All</a></li>
        <li><a href="./">Web App</a></li>
        <li><a href="./">UI/UX</a></li>
        <li><a href="./">Graphics Design</a></li>
        <li><a href="./">Mobile App</a></li>
        <li><a href="./">Branding</a></li>
        <li><a href="./">Marketing</a></li>
    </ul>

    <ul class="galerry">
        <li><a href="./">Học Web Chuẩn</a></li>
        <li><a href="./">Học Web Chuẩn</a></li>
        <li><a href="./">Học Web Chuẩn</a></li>
    </ul>
</section>

</body>
</html>
