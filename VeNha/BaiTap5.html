<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Khoa CNTTKD</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center; /* Gợi ý i: Căn giữa toàn trang */
        background-color: #ffffff;
        padding: 40px;
    }
    .best-shared {
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
    }
    .best-shared .logo img {
        width: 280px; /* Chỉnh kích thước ảnh logo cho vừa vặn */
        margin-bottom: 20px;
    }
   .best-shared h2 {
    font-size: 38px;
    color: #333;
    font-weight: normal; /* Thêm dòng này để chữ Best và Company không bị đậm */
    margin-bottom: 15px;
}
.best-shared h2 strong {
    color: #00a8ff;      /* Màu xanh cyan/blue chuẩn của chữ Shared Hosting */
    font-weight: bold;
}
    .lead-text {
        font-style: italic;
        color: #555;
        margin-bottom: 30px;
        font-size: 15px;
    }
    .btn-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .btn-list li {
        display: inline-block; /* Gợi ý iii: Hiển thị nút nằm ngang */
        margin: 0 10px;
    }
    .btn-list li a {
        text-decoration: none; /* Gợi ý ii: Bỏ gạch chân */
        display: inline-block;
        padding: 12px 25px; /* <-- Đã thêm dấu chấm phẩy (;) chuẩn chỉnh ở đây */
        background-color: #333333; /* Nền nút xám đậm */
        color: white;
        border-radius: 4px;
        font-weight: bold;
        font-size: 14px;
    }
    .btn-list li a:hover {
        background-color: #555555;
    }
</style>
</head>
<body>
<section class="best-shared">
    <!-- Trỏ ra thư mục Tuan3 lấy file BIT.png -->
    <p class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/vi/a/a1/Logo_UEH_xanh.png" alt="Logo UEH">
</p>
    
    <h2>Best <strong>Shared Hosting</strong> Company</h2>
    <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
    <ul class="btn-list">
        <li><a href="./">View Plans</a></li>
        <li><a href="./">All Features</a></li>
    </ul>
</section>
</body>
</html>
